# Minimal single-binary Loki for a lab. Production uses object storage and
# separate read/write paths; the query language is identical.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore: { store: inmemory }

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index: { prefix: index_, period: 24h }

limits_config:
  # Loki INDEXES LABELS ONLY, and stores the log line as an opaque blob. That
  # is why it is cheap - and why the same cardinality rule as Prometheus
  # applies: never put a request id or a user id in a LABEL. Put it in the
  # line, and filter on it at query time with | json.
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
