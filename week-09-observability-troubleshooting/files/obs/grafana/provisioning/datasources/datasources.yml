# Provisioning datasources as CODE rather than clicking them in the UI: the
# same reason cloud-init exists. A Grafana you cannot rebuild from a file is a
# pet (week 0).
apiVersion: 1

# PIN THE `uid`s. Grafana derives a uid when you leave it out, and dashboard
# JSON references datasources BY UID, not by name. Leave them implicit and the
# first dashboard you commit to ../dashboards/ works on your machine and breaks
# on every rebuild elsewhere - the panels come back with "Datasource <uid> was
# not found" and the graphs are empty. An explicit uid is a stable contract
# between this file and every dashboard file - without it the comment above is
# only half true, because the datasources rebuild and the dashboards do not.
datasources:
  - name: Prometheus
    uid: prometheus           # referenced as {"datasource":{"uid":"prometheus"}}
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s        # match prometheus scrape_interval

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      # Links a log line to the trace it belongs to, when you add tracing.
      maxLines: 1000
