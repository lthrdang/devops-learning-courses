server:
  http_listen_port: 9080
  log_level: warn

positions:
  # Where promtail remembers how far it read. Losing this file means either
  # re-shipping everything or silently skipping - it belongs on a volume.
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # --- systemd journal ---------------------------------------------------
  - job_name: journal
    journal:
      max_age: 12h
      labels: { job: systemd-journal }
    relabel_configs:
      - source_labels: ["__journal__systemd_unit"]
        target_label: unit
      - source_labels: ["__journal__hostname"]
        target_label: host

  # --- docker containers -------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # LABEL CARDINALITY: container name and stream are bounded sets. The
      # container ID would be unbounded across restarts and would eventually
      # make queries slow and storage large. Keep labels few and small.
    pipeline_stages:
      # If the app logs JSON (week 6), promote a couple of fields to labels
      # and leave the rest queryable in the line itself.
      - json:
          expressions: { level: level }
      - labels: { level: }

  # --- plain files -------------------------------------------------------
  - job_name: varlogs
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          __path__: /var/log/{syslog,auth.log,nginx/*.log}
