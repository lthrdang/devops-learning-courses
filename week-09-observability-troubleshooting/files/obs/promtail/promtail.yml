server:
  http_listen_port: 9080
  log_level: warn

positions:
  # Where promtail remembers how far it read. Losing this file means either
  # re-shipping everything or silently skipping - it belongs on a volume.
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # --- NO systemd journal job, and that is deliberate --------------------
  # You will find `journal:` scrape configs all over the internet for exactly
  # this stack. They do not work with the official grafana/promtail image. The
  # journal reader needs cgo (CGO_ENABLED=1) and the promtail_journal_enabled
  # build tag, and the published image is built with neither - so promtail
  # accepts the config, logs one warning at startup, ships nothing, and
  # job="systemd-journal" never appears in Loki. A config that parses is not a
  # config that works; check the DATA arrived, not that the process started.
  # If you want host logs here, either read the files under /var/log (the
  # varlogs job below does) or move to Grafana Alloy, which ships journal
  # support in its stock image.

  # --- docker containers -------------------------------------------------
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: container
      - source_labels: ["__meta_docker_container_log_stream"]
        target_label: stream
      # LABEL CARDINALITY: container name and stream are bounded sets. The
      # container ID would be unbounded across restarts and would eventually
      # make queries slow and storage large. Keep labels few and small.
    pipeline_stages:
      # If the app logs JSON (week 6), promote a couple of fields to labels
      # and leave the rest queryable in the line itself.
      - json:
          expressions: { level: level }
      - labels: { level: }

  # --- plain files -------------------------------------------------------
  - job_name: varlogs
    static_configs:
      - targets: [localhost]
        labels:
          job: varlogs
          __path__: /var/log/{syslog,auth.log,nginx/*.log}
