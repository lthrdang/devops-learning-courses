global:
  scrape_interval: 15s        # how often to pull. 15s is a sane default;
                              # shorter costs storage, longer blurs incidents.
  evaluation_interval: 15s    # how often to evaluate alert rules
  external_labels:
    cluster: lab

rule_files:
  # An ABSOLUTE path, resolved by whatever process reads this file. Inside the
  # container the compose file mounts ./prometheus at /etc/prometheus, so it
  # resolves. If you mount that directory somewhere else - say /p - when you
  # run promtool by hand, this line still says /etc/prometheus and promtool
  # fails to find the file. That is not promtool being fussy; it is what an
  # absolute path means. Mount the directory where the config says it lives.
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Prometheus scrapes ITSELF. Do not remove this - if Prometheus is
  # unhealthy, this is how you find out.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # node_exporter runs on the HOST OS, not in a container. That is deliberate:
  # a container sees a namespaced /proc and /sys, so host metrics gathered from
  # inside one are subtly wrong.
  #
  # host.docker.internal is how a container reaches the host - but it is NOT
  # automatic on Docker Engine. It is a Docker Desktop feature (macOS and
  # Windows), and on Linux the name simply does not resolve unless the service
  # declares extra_hosts: ["host.docker.internal:host-gateway"]. It does, in
  # docker-compose.yml; if you copy this scrape config into another stack and
  # forget that line, this job goes DOWN with "dial tcp: lookup
  # host.docker.internal" and stays there.
  - job_name: node
    static_configs:
      - targets: ["host.docker.internal:9100"]
        labels: { instance: obs-host }

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: app
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8000"]
        labels: { service: labapp }
