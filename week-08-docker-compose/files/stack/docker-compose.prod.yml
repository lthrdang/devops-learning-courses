# ---------------------------------------------------------------------------
# Production overlay. Used EXPLICITLY, so the dev override does not apply:
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Naming this file "override" would make it automatic - and then you could
# never run the dev configuration. The explicitness is the point.
# ---------------------------------------------------------------------------

services:
  api:
    environment:
      LOG_LEVEL: info
    volumes: []                    # no source bind mount: run what you shipped
    deploy:
      replicas: 3
      resources:
        limits: { memory: 256M, cpus: "0.5" }
        reservations: { memory: 128M }
    restart: always

  db:
    ports: []                      # nothing published, at all
    deploy:
      resources:
        limits: { memory: 512M }

  proxy:
    restart: always
    deploy:
      resources:
        limits: { memory: 128M }
