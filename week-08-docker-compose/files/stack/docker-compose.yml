# ---------------------------------------------------------------------------
# The week-8 reference stack:  nginx -> api -> (postgres, redis)
#
#   docker compose config      # ALWAYS read this before debugging the YAML
#   docker compose up -d
#   docker compose ps
#
# Note there is no `version:` key. It is obsolete in Compose v2 and only
# produces a warning.
# ---------------------------------------------------------------------------

services:
  # --- edge -----------------------------------------------------------------
  proxy:
    image: nginx:alpine
    ports:
      # Published to LOOPBACK ONLY. Docker's rules bypass ufw (week 7 §3.3), so
      # `- "8080:80"` would expose this to the whole network regardless of the
      # firewall. Bind the interface explicitly, every time.
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # --- application ----------------------------------------------------------
  api:
    build: ./api
    image: lab/stack-api:${APP_VERSION:-1.0}
    environment:
      APP_VERSION: ${APP_VERSION:-1.0}
      DB_HOST: db                  # a DNS NAME on the compose network, not an IP
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_NAME: ${POSTGRES_DB:-appdb}
      # The _FILE convention keeps the value out of `docker inspect`.
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_HOST: cache
      REDIS_PORT: "6379"
    secrets:
      - db_password
    depends_on:
      db:
        # service_healthy, NOT service_started. The default waits only for the
        # container to exist, which for postgres is several seconds before it
        # accepts connections. This one line removes an entire class of flaky
        # startup failures.
        condition: service_healthy
      cache:
        condition: service_started   # a cache is optional; do not block on it
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2).status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          # Without a limit, one leak takes the whole HOST down and the kernel
          # OOM killer picks an arbitrary victim - possibly the database.
          memory: 256M
    restart: unless-stopped

  # --- data -----------------------------------------------------------------
  db:
    image: postgres:16-alpine
    environment:
      # `:?` refuses to start with a clear message rather than silently coming
      # up with an empty password. Use it for anything without a safe default.
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
    secrets:
      - db_password
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      # pg_isready is postgres's own readiness check - far better than a TCP
      # probe, which succeeds while the server is still recovering.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # NO `ports:` - the database is reachable only from the compose network.
    # Publishing 5432 is one of the most common ways databases end up on the
    # internet, because Docker bypasses the host firewall.
    restart: unless-stopped

  cache:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 5
    restart: unless-stopped

  # --- tools (profile-gated: only runs when explicitly requested) -----------
  seed:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGPASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    entrypoint: ["sh", "-c"]
    command:
      - |
        export PGPASSWORD=$$(cat /run/secrets/db_password)
        psql -h db -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-appdb} -c \
          "CREATE TABLE IF NOT EXISTS items (id serial primary key, name text);
           INSERT INTO items (name) SELECT 'widget' WHERE NOT EXISTS (SELECT 1 FROM items);"
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  dbdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt

networks:
  default:
    name: labstack
