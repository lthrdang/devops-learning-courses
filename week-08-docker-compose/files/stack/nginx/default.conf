# ---------------------------------------------------------------------------
# THE DOCKER + NGINX DNS TRAP - read this before you copy the config below.
#
# The obvious config is:
#
#     upstream api_upstream { server api:8000; }
#     location / { proxy_pass http://api_upstream; }
#
# It WORKS, and it is subtly broken. Open-source nginx resolves an upstream
# hostname exactly ONCE, when the configuration is loaded, and caches the
# result forever. So:
#
#   * `docker compose up -d --scale api=3` starts three replicas, and nginx
#     keeps sending every request to the one address it resolved at startup.
#   * When a container is recreated with a new IP, nginx keeps proxying to the
#     dead address and returns 502 until someone reloads it.
#
# This was measured in this very lab: with 3 replicas running, 9/9 requests
# went to a single container. After `docker compose restart proxy`, they
# spread 4/2/3. The replicas were healthy the whole time - nginx simply never
# looked up the name again.
#
# THE FIX has two parts, and BOTH are required:
#   1. `resolver 127.0.0.11` - Docker's embedded DNS server, with a short valid=
#   2. put the upstream in a VARIABLE. nginx only re-resolves names that appear
#      in a variable in proxy_pass; a literal name is resolved at load time.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS always lives at 127.0.0.11 inside a container on a
    # user-defined network. valid=10s caps how long nginx trusts an answer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # The variable is load-bearing. Without it nginx resolves `api` once at
        # startup; with it, nginx re-resolves per the resolver's valid= window
        # and picks up new replicas and new IPs automatically.
        #
        # It also changes URI handling - see the note at the bottom of the file
        # BEFORE you copy this into a `location /api/ { ... }`.
        set $upstream_api api;
        proxy_pass http://$upstream_api:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout   15s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# NOTE ON THE TRADE-OFFS. There are TWO, and the second one is the one that
# bites people, because it is silent.
#
# 1. NO UPSTREAM BLOCK. A variable in proxy_pass means you cannot use an
#    `upstream` block, so you lose keepalive to the backend and the least_conn
#    algorithm - Docker's DNS round-robins instead. For a single-host dev stack
#    that is the right trade. When you need real load balancing with health
#    checks, put HAProxy in front (week 5) or move to Swarm, whose routing mesh
#    handles this properly (week 10).
#
# 2. URI HANDLING CHANGES, AND IT CHANGES SILENTLY. nginx's docs are explicit:
#    when proxy_pass uses variables, "if URI is specified in the directive, it
#    is passed to the server as is, replacing the original request URI". The
#    normalising rewrite that a LITERAL proxy_pass performs no longer applies.
#
#    Measured against a backend that echoes back $request_uri, requesting
#    /<prefix>/items through each of these four locations:
#
#      location /a/ { proxy_pass http://api:8000/; }            # literal + URI
#        backend saw:  /items                 <- prefix stripped, as expected
#
#      location /b/ { set $u api; proxy_pass http://$u:8000/; } # variable + URI
#        backend saw:  /                      <- !!! the WHOLE request URI was
#                                                 replaced by the literal "/".
#                                                 Every path collapses to root.
#
#      location /c/ { set $u api; proxy_pass http://$u:8000; }  # variable, NO URI
#        backend saw:  /c/items               <- passed through unchanged; the
#                                                 prefix is NOT stripped
#
#      location /d/ { set $u api;
#                     rewrite ^/d/(.*)$ /$1 break;
#                     proxy_pass http://$u:8000; }
#        backend saw:  /items                 <- do the rewrite yourself
#
#    Read the /b/ row again. That is the footgun: the config loads, nginx
#    starts, the healthcheck passes, and every single API call arrives at the
#    backend as "/". Nothing errors. You find out from your users.
#
#    THE CONFIG ABOVE IS SAFE because it sits at `location /` with no URI part
#    after the port - it is the /c/ case with an empty prefix, so there is
#    nothing for the difference to change. It is NOT safe to paste under a
#    prefix. If you move this pattern there, use the /d/ form and then TEST the
#    path the backend actually receives - do not infer it.
#
#    https://nginx.org/en/docs/http/ngx_http_proxy_module.html#proxy_pass
