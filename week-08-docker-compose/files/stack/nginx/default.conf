# ---------------------------------------------------------------------------
# THE DOCKER + NGINX DNS TRAP - read this before you copy the config below.
#
# The obvious config is:
#
#     upstream api_upstream { server api:8000; }
#     location / { proxy_pass http://api_upstream; }
#
# It WORKS, and it is subtly broken. Open-source nginx resolves an upstream
# hostname exactly ONCE, when the configuration is loaded, and caches the
# result forever. So:
#
#   * `docker compose up -d --scale api=3` starts three replicas, and nginx
#     keeps sending every request to the one address it resolved at startup.
#   * When a container is recreated with a new IP, nginx keeps proxying to the
#     dead address and returns 502 until someone reloads it.
#
# This was measured in this very lab: with 3 replicas running, 9/9 requests
# went to a single container. After `docker compose restart proxy`, they
# spread 4/2/3. The replicas were healthy the whole time - nginx simply never
# looked up the name again.
#
# THE FIX has two parts, and BOTH are required:
#   1. `resolver 127.0.0.11` - Docker's embedded DNS server, with a short valid=
#   2. put the upstream in a VARIABLE. nginx only re-resolves names that appear
#      in a variable in proxy_pass; a literal name is resolved at load time.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Docker's embedded DNS always lives at 127.0.0.11 inside a container on a
    # user-defined network. valid=10s caps how long nginx trusts an answer.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        # The variable is load-bearing. Without it nginx resolves `api` once at
        # startup; with it, nginx re-resolves per the resolver's valid= window
        # and picks up new replicas and new IPs automatically.
        set $upstream_api api;
        proxy_pass http://$upstream_api:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_connect_timeout 3s;
        proxy_read_timeout   15s;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# NOTE ON THE TRADE-OFF: using a variable disables nginx's `upstream` block, so
# you lose keepalive to the backend and the least_conn algorithm - Docker's DNS
# round-robins instead. For a single-host dev stack that is the right trade.
# When you need real load balancing with health checks, put HAProxy in front
# (week 5) or move to Swarm, whose routing mesh handles this properly (week 10).
