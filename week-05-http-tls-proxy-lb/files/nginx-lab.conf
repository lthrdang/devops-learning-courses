# /etc/nginx/sites-available/lab.conf
#
# Reference reverse-proxy + TLS termination config for week 5.
# Validate with `nginx -t`, apply with `systemctl reload nginx`.

upstream app_backend {
    # least_conn beats round-robin whenever request durations vary, which they
    # always do in practice. Round-robin sends a request to a backend that is
    # already busy with a slow one; least_conn does not.
    least_conn;

    server 127.0.0.1:9001 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:9002 max_fails=3 fail_timeout=30s;
    server 127.0.0.1:9003 backup;      # only used when every other member is down

    # Reuse upstream TCP connections. Without this, nginx opens a NEW connection
    # to the backend for every single request - three extra round trips each.
    keepalive 32;
}

# Rate limiting: 10 requests/second per client IP, with a burst of 20.
# Defined here, applied per-location below.
#
# NOTE FOR BENCHMARKING: this limit applies to YOU too. A load generator is a
# single client IP, so `ab`/`wrk` against `location /` measures the limiter and
# not the server - past the first ~21 requests it collects 503s. Comment
# `limit_req` out before you benchmark (C5.5), and put it back before C5.7,
# which exercises the limiter on purpose.
limit_req_zone $binary_remote_addr zone=perip:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name app.lab.local;

    # Everything except the ACME challenge goes to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/html; }

    # ======================================================================
    # PART 2 ONLY - DELETE THIS BLOCK WHEN YOU REACH PART 3.
    #
    # Part 2 has no certificate yet, so the 443 server block below is
    # commented out and this port-80 block is the only thing serving. A bare
    # `return 301 https://...` would therefore redirect every Part 2 request
    # into a closed port, and every `curl | jq` in the lab would fail on an
    # empty body. So for Part 2 you proxy in plaintext here instead.
    #
    # This is a DELIBERATE DUPLICATE of `location /` in the 443 block. Keeping
    # it verbatim is the point: in Part 3 you delete this whole block, restore
    # the redirect below, and the identical location in the TLS block takes
    # over - so you can see that nothing about proxying changed, only where
    # TLS is terminated.
    location / {
        limit_req zone=perip burst=20 nodelay;

        proxy_pass http://app_backend;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;

        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
    # ===================== END OF THE PART 2 BLOCK ========================

    # PART 3: uncomment this line after deleting the block above.
    # location / { return 301 https://$host$request_uri; }
}

server {
    # `http2 on;` as a standalone directive only exists in nginx 1.25.1+.
    # Ubuntu 24.04 ships nginx 1.24.0, where it is an "unknown directive" and
    # `nginx -t` refuses to start. The `http2` parameter ON the listen line is
    # the older spelling: deprecated in 1.25+ but still accepted there, and the
    # ONLY spelling that works in 1.24. Use it, and check `nginx -v` before you
    # copy an http2 line out of a blog post written against a newer release.
    listen 443 ssl http2 default_server;
    server_name app.lab.local;

    ssl_certificate     /etc/nginx/tls/app.lab.local.fullchain.crt;
    ssl_certificate_key /etc/nginx/tls/app.lab.local.key;

    # Settings from https://ssl-config.mozilla.org/ (intermediate profile).
    # Copy TLS settings from there, never from a blog post - cipher advice ages
    # badly and a stale copy-paste is how weak ciphers stay in production.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # Security headers. HSTS is commented out deliberately: it is HARD TO UNDO -
    # browsers remember it for max-age even after you remove the header, so a
    # mistake locks users out of the HTTP version of your site for a year.
    # add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log warn;

    # The proxy's OWN health, not the backends'. A load balancer above nginx
    # uses this to decide whether nginx itself is alive.
    location = /healthz {
        access_log off;                # probes would otherwise dominate the log

        # TWO add_header traps live in this location, and both are invisible
        # unless you diff headers between locations. `nginx -t` passes either way.
        #
        # 1. add_header IS NOT ADDITIVE ACROSS LEVELS. A location that declares
        #    even ONE add_header of its own inherits NONE from the server block -
        #    and `always` does not save you. Putting `add_header Content-Type`
        #    here would silently drop X-Content-Type-Options and X-Frame-Options
        #    FROM THIS LOCATION ONLY. Measured: /healthz returned neither, / returned both.
        #
        # 2. add_header Content-Type does not SET the entity type, it APPENDS a
        #    header - so the response went out with TWO Content-Type lines:
        #    application/octet-stream (from default_type) followed by text/plain.
        #    `default_type` is the directive that actually sets it.
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        limit_req zone=perip burst=20 nodelay;

        proxy_pass http://app_backend;

        # WITHOUT THESE FOUR LINES the backend believes every request came from
        # the proxy, over plain HTTP. Applications then log the wrong client IP,
        # apply rate limits to the proxy instead of to users, and build redirect
        # URLs with http:// - producing an infinite redirect loop.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for upstream keepalive to actually engage.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 5s;     # cannot connect  -> 502
        proxy_send_timeout   30s;
        proxy_read_timeout   30s;     # upstream too slow -> 504

        # Retry the next backend on these conditions. NOTE: non_idempotent is
        # deliberately absent - retrying a POST can charge a card twice.
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }
}
