# /etc/haproxy/haproxy.cfg
#
# Reference L7 load balancer for week 5. Validate with:
#   haproxy -c -f /etc/haproxy/haproxy.cfg

global
    log /dev/log local0
    maxconn 4096
    # Two DIFFERENT protections, and it is common to see only the second one:
    #   chroot     - having bound :80/:443 as root, HAProxy confines its
    #                filesystem view to an empty directory. A compromised
    #                process cannot read /etc/shadow or your private keys.
    #   user/group - drops root privileges once the ports are bound.
    # Ubuntu's packaged haproxy.cfg sets both; a config that omits `chroot`
    # while claiming to chroot is worse than one that says nothing.
    chroot /var/lib/haproxy
    user  haproxy
    group haproxy
    daemon

    # Carried over verbatim from Ubuntu's packaged haproxy.cfg. They do nothing
    # until something here binds with `ssl` - and that is exactly why they must
    # survive being copied over: the day someone adds a TLS bind, the defaults
    # are already right. Overwriting a distro config discards its hardening
    # silently; the hardening is not restored by remembering it later.
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    stats socket /run/haproxy/admin.sock mode 660 level admin expose-fd listeners

defaults
    log     global
    mode    http
    option  httplog
    option  dontlognull
    # These three timeouts are the ones that matter, and the ones people leave
    # at defaults and then wonder about:
    timeout connect 5s      # give up connecting to a backend      -> 503
    timeout client  30s     # client stopped sending               -> 408
    timeout server  30s     # backend too slow to respond          -> 504
    retries 2
    option  redispatch      # on retry, try a DIFFERENT server, not the same one

# --- the front door --------------------------------------------------------
frontend fe_http
    bind *:80
    # Capture the real client IP for the backends. Without this the app sees
    # HAProxy's address for every request.
    option forwardfor
    http-request set-header X-Forwarded-Proto http

    # Route by path. This is what "L7" buys you - an L4 balancer cannot do it.
    acl is_api  path_beg /api
    acl is_stat path_beg /static

    use_backend be_api    if is_api
    use_backend be_static if is_stat
    default_backend be_app

# --- backends --------------------------------------------------------------
backend be_app
    balance leastconn

    # Health checking. Read these four numbers as a sentence:
    # "probe GET /health every 2s; remove after 3 consecutive failures;
    #  return after 2 consecutive successes."
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 maxconn 200

    server app1 127.0.0.1:9001 check
    server app2 127.0.0.1:9002 check
    # A backup member serves only when every primary is down. Usually it returns
    # a static "we are down for maintenance" page rather than real traffic -
    # a controlled 503 beats a connection refused.
    server app3 127.0.0.1:9003 check backup

backend be_api
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    default-server inter 2s fall 3 rise 2
    server api1 127.0.0.1:9101 check

backend be_static
    balance roundrobin
    server st1 127.0.0.1:9201 check

# --- observability ---------------------------------------------------------
# The stats page is genuinely useful during an incident: it shows, live, which
# backends are UP/DOWN, current sessions, queue depth, and error counts.
listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
    stats show-legends
